name: 01-1 - Integration - TEST

on:
  workflow_call:
    
jobs:
  Backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mariadb:
        image: mariadb:latest
        env:
          MARIADB_ROOT_PASSWORD: toor
          MARIADB_DATABASE: base
          MARIADB_USER: roger
          MARIADB_PASSWORD: regor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
    env: 
      BDD_HOST: 127.0.0.1
      BDD_NAME: base

    steps:
      - name: Checkout 
        uses: actions/checkout@v3

      - name: Database Check
        run: |
          sudo apt-get install -y mysql-client
          mysql --host 127.0.0.1 --port 3306 -u root -ptoor -e "SHOW DATABASES"

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Intall Dep
        run: npm i 

      - name: init Bdd
        run: npm run initbdd

      - name: populate Bdd
        run: |
          mysql -u root -ptoor --host 127.0.0.1 --port 3306 --database base < ./test/insert_test_user.sql

      - name: Run ALL Tests and Coverage
        run: npm run test:cov     

      - name: upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-coverage-report
          path: backend/coverage/
          retention-days: 1

  Frontend:
    needs: [Backend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Start Build backend
        run: |
          cd ..
          docker compose -f docker-compose-back-build.yml up -d
          docker ps -a

      - name: Sleep for 10 seconds
        uses: jakejarvis/wait-action@master
        with:
          time: '10s'
      
      - name: test Backend Container
        if: success()
        run: curl http://127.0.0.1:12000

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Cypress E2E Install
        uses: cypress-io/github-action@v6
        with:
          runTests: false
          working-directory: frontend

      - name: Install dependencies
        run: npm i

      - name: Start E2E Test
        uses: cypress-io/github-action@v6
        with: 
          install: false
          working-directory: frontend
          start: npm run dev

      - name: Generate Coverage Repport
        run: npm run cypress:cov

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: frontend/cypress/videos
          retention-days: 1

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-coverage-report
          path: frontend/coverage
          retention-days: 1

      - name: Clean Builder Backend Docker
        if: always()        
        run: |
          cd ..
          docker compose -f docker-compose-back-build.yml down
